<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShadowWatch</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body">
<form class="login" method="post" autocomplete="off">
  <div class="logo"><span class="dot"></span>ShadowWatch</div>
  <p class="muted">Enter access code</p>
  <div class="pin">
    {% for i in range(4) %}<input inputmode="numeric" pattern="[0-9]" maxlength="1" class="d" aria-label="digit {{i+1}}">{% endfor %}
  </div>
  <input type="hidden" name="pin" id="pin">
  {% if err %}<p class="err">{{ err }}</p>{% endif %}
  <button type="submit">Unlock</button>
</form>
<script>
const ds=[...document.querySelectorAll('.d')],f=document.querySelector('form'),p=document.getElementById('pin');
ds[0].focus();
ds.forEach((d,i)=>{
  d.addEventListener('input',()=>{d.value=d.value.replace(/\D/g,'');if(d.value&&i<3)ds[i+1].focus();if(ds.every(x=>x.value)){p.value=ds.map(x=>x.value).join('');f.submit();}});
  d.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!d.value&&i>0)ds[i-1].focus();});
  d.addEventListener('paste',e=>{const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);if(t.length===4){e.preventDefault();t.split('').forEach((c,j)=>ds[j].value=c);p.value=t;f.submit();}});
});
f.addEventListener('submit',()=>{p.value=ds.map(x=>x.value).join('');});
</script></body></html>
